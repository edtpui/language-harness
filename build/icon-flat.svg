<?xml version="1.0" encoding="UTF-8"?>
<!-- Language Harness app icon: two overlapping speech bubbles on the app's
     dark squircle. Shapes only (no text), so every renderer draws it the same.
     scripts/make-icons.mjs renders build/icon.ico, icon.png and icon.icns. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect x="24" y="24" width="976" height="976" rx="232" ry="232" fill="#151515"/>
  <!-- The back bubble: outlined, tail to the lower right. -->
  <g fill="none" stroke="#9a9a9a" stroke-width="44" stroke-linejoin="round" stroke-linecap="round">
    <path d="M520 258 H760 A110 110 0 0 1 870 368 V556 A110 110 0 0 1 760 666 H742 L782 768 L652 666 H520 A110 110 0 0 1 410 556 V368 A110 110 0 0 1 520 258 Z"/>
  </g>
  <!-- The front bubble: solid, tail to the lower left, cut out of the back one. -->
  <path d="M276 380 H556 A118 118 0 0 1 674 498 V682 A118 118 0 0 1 556 800 H396 L262 902 L298 800 H276 A118 118 0 0 1 158 682 V498 A118 118 0 0 1 276 380 Z"
        fill="#ffffff" stroke="#151515" stroke-width="36" stroke-linejoin="round"/>
  <!-- Three dots: speech in progress. -->
  <g fill="#151515">
    <circle cx="300" cy="590" r="36"/>
    <circle cx="416" cy="590" r="36"/>
    <circle cx="532" cy="590" r="36"/>
  </g>
</svg>
